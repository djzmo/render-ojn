name: CI

on:
  push:
  pull_request:

jobs:
  windows:
    strategy:
      matrix:
        preset: [windows-x64, windows-x86-legacy]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      # The action discovers a vcpkg.json with the glob `**/vcpkg.json` and
      # reads builtin-baseline from it. ports/mp3lame/vcpkg.json is an overlay
      # *port* definition, which correctly carries no baseline, so leaving it
      # discoverable fails the job with "A Git commit id for vcpkg's baseline
      # was not found". Exclude ports/ so only the root manifest matches.
      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonIgnores: "['**/vcpkg/**', '**/ports/**']"
      - uses: ilammy/msvc-dev-cmd@v1
      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.preset }}-debug
      - run: cmake --build --preset ${{ matrix.preset }}-release
      - run: ctest --preset ${{ matrix.preset }}-test
      - if: matrix.preset == 'windows-x64'
        run: cmake --build out/build/windows-x64 --target renderojn_package --config Release
      - if: matrix.preset == 'windows-x64'
        run: |
          # Match on a glob rather than a literal version: a hardcoded filename
          # silently breaks every release bump.
          $archive = Get-ChildItem out/build/windows-x64/RenderOJN-*-windows-x64.zip | Select-Object -First 1
          if (-not $archive) { throw "No Windows release archive was produced" }
          cmake -E tar tf $archive.FullName
          Get-Content out/build/windows-x64/SHA256SUMS
      - if: matrix.preset == 'windows-x64'
        uses: actions/upload-artifact@v4
        with:
          name: RenderOJN-windows-x64
          path: out/build/windows-x64/RenderOJN-*-windows-x64.zip

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t renderojn-manylinux2014 -f cmake/Dockerfile.manylinux2014 .
      - run: docker run --rm -e CMAKE_BUILD_PARALLEL_LEVEL=2 -v "${{ github.workspace }}:/src" renderojn-manylinux2014 bash /src/cmake/build-manylinux2014.sh
      # The container runs as root and writes its build trees into the mounted
      # workspace, so out/ is left root-owned. Later steps run as the unprivileged
      # runner user and cannot write there -- configuring the fuzz preset failed
      # with "Unable to (re)create the private pkgRedirects directory". Hand the
      # tree back before any non-root step touches it.
      - run: sudo chown -R "$(id -u):$(id -g)" out
      - run: |
          cmake -E tar tf out/build/linux-x64-manylinux2014/RenderOJN-*-linux-x86_64-glibc2.17.tar.gz
          cat out/build/linux-x64-manylinux2014/SHA256SUMS
      # The presets resolve vcpkg through $env{VCPKG_ROOT}. Windows runners set
      # that themselves because their image ships vcpkg, but Ubuntu runners do
      # not, and lukka/run-vcpkg cannot supply it here: that action expects
      # vcpkg as a git submodule plus a vcpkg-configuration.json, and this
      # project has neither -- it pins its registry through builtin-baseline in
      # vcpkg.json. It left a half-initialized tree that CMake then failed on.
      # Bootstrap the pinned baseline directly, exactly as
      # cmake/build-manylinux2014.sh already does for the release build.
      - name: Bootstrap vcpkg at the pinned baseline
        run: |
          baseline=$(python3 -c "import json;print(json.load(open('vcpkg.json'))['builtin-baseline'])")
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          git -C "$RUNNER_TEMP/vcpkg" fetch --depth 1 origin "$baseline"
          git -C "$RUNNER_TEMP/vcpkg" checkout --detach "$baseline"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
      - run: sudo apt-get update && sudo apt-get install -y clang
      - run: cmake --preset linux-x64-fuzz
      - run: cmake --build --preset linux-x64-fuzz-debug --target renderojn_fuzz_ojn renderojn_fuzz_ojm
      - run: out/build/linux-x64-fuzz/Debug/renderojn_fuzz_ojn -runs=1000 fuzz/corpus/ojn
      - run: out/build/linux-x64-fuzz/Debug/renderojn_fuzz_ojm -runs=1000 fuzz/corpus/ojm

  # Independent of the C++ jobs on purpose. Those take ~30 minutes with vcpkg,
  # and web feedback nobody waits for is web feedback nobody reads.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # `npm run build` is deliberately absent: it runs scripts/sync-wasm.mjs,
      # which needs the Emscripten artifact that is git-ignored and requires an
      # emsdk + vcpkg build. No test touches that artifact, which is what lets
      # this job run on a fresh clone in seconds.

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      # Excludes ports/ for the same reason as the windows job above.
      #
      # runVcpkgInstall stays off here. It defaults on whenever a manifest is
      # found and runs `vcpkg install --triplet universal-osx` as its own step,
      # before CMake configures. That standalone invocation gets no
      # --overlay-triplets, so it resolves the triplet *name* but never reads
      # triplets/universal-osx.cmake -- and so never sees
      # VCPKG_OSX_ARCHITECTURES. Every dependency was built x86_64-only, and
      # the universal link then failed with each LAME, libsndfile and Catch2
      # symbol "not found for architecture arm64". Letting the toolchain file
      # install during `cmake --preset` applies the preset's
      # VCPKG_OVERLAY_TRIPLETS, which is the only path that honours the
      # architecture list.
      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonIgnores: "['**/vcpkg/**', '**/ports/**']"
          runVcpkgInstall: false
      - run: cmake --preset macos-universal
      # Fail at the cause rather than at the link. A dependency built for one
      # architecture otherwise surfaces ~20 minutes later as a wall of
      # undefined symbols, which reads like a source problem and is not one.
      #
      # The tree lives under the preset's binaryDir, not the workspace root:
      # vcpkg's toolchain file installs into ${CMAKE_BINARY_DIR}/vcpkg_installed.
      # The workspace-root path only held while run-vcpkg did the install, and
      # checking it after the move made this step fail with "missing
      # vcpkg_installed/universal-osx/lib/libmp3lame.a".
      - name: Assert the dependencies are actually universal
        run: |
          for lib in libmp3lame.a libsndfile.a libtag.a; do
            path="out/build/macos-universal/vcpkg_installed/universal-osx/lib/$lib"
            test -f "$path" || { echo "missing $path"; exit 1; }
            archs=$(lipo -archs "$path")
            echo "$lib: $archs"
            case "$archs" in
              *x86_64*arm64*|*arm64*x86_64*) ;;
              *) echo "::error::$lib is not universal (got: $archs)"; exit 1 ;;
            esac
          done
      - run: cmake --build --preset macos-universal-debug
      - run: cmake --build --preset macos-universal-release
      - run: ctest --preset macos-universal-test
      - run: cmake --build out/build/macos-universal --target renderojn_package --config Release
      - run: |
          lipo -archs out/build/macos-universal/Release/RenderOJN
          cmake -E tar tf out/build/macos-universal/RenderOJN-*-macos-universal.zip
          cat out/build/macos-universal/SHA256SUMS
